repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-ast  # 验证 Python AST 合法

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0  # 与 requirements-ci.txt 中 ruff>=0.15.0 对齐
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: detect-sensitive-secrets
        name: Detect sensitive secrets
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: true
