# 默认配置：相对项目根目录（与 README 示例一致）
pdf_path: "03_PDF_to_Excel/input/不同剂量组ADR分析 (TFL).pdf"
excel_path: "03_PDF_to_Excel/output/不同剂量组ADR分析 (TFL).xlsx"


rules:
  - name: "不良事件相关表格"
    search:
      keyword: "不良事件"
      page: null
    excel:
      sheet: "Sheet1"
      cell: "B2"
      extract: table

  - name: "剂量组相关文本"
    search:
      keyword: "剂量"
      page: null
    excel:
      sheet: "Sheet1"
      cell: "A10"
